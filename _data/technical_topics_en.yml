- id: uikit-graphics
  name: UIKit & graphics
  url: /en/journal/topics/uikit-graphics/
  description: Layout, lists, gestures, rich text, UIView, Core Animation and drawing.
  lead: A visual effect often depends on layout, events and drawing at the same time. These historical notes start
    with concrete controls and record how lists, rich text, transitions and animations were built. Pick the article
    closest to the problem in front of you.
  reading:
  - 'Begin with the control or interaction involved: list heights, event delivery, text input or popovers. That
    gives animation code a useful context.'
  - For animations, separate the initial state, final state, duration and coordinate transforms. Then compare UIView
    animations, keyframes and Core Animation.
  - For Core Text, Core Graphics and wave effects, check the coordinate system, drawing bounds and Swift version
    before reusing visual parameters.
- id: swift-runtime
  name: Swift & runtime
  url: /en/journal/topics/swift-runtime/
  description: Swift language notes, Objective-C messaging, KVO, blocks and code organisation.
  lead: From Swift 2 and Swift 3 notes to the Objective-C runtime and design patterns, these articles preserve the
    process of understanding language behaviour. Syntax changes; asking why a piece of code executes this way is
    still useful.
  reading:
  - Start with delegation, blocks and common Swift pitfalls. Distinguish values, references, closure captures and
    object lifetimes.
  - For runtime articles, work through properties and ivars, messaging, then dictionary-to-model conversion. Separate
    what the runtime can do from what your project actually needs.
  - Compare templates, singletons, flyweights and responsibilities against a concrete duplication or shared-state
    problem before choosing a pattern.
- id: concurrency-performance
  name: Concurrency & performance
  url: /en/journal/topics/concurrency-performance/
  description: Threads, RunLoop, keeping a thread alive, UI stalls and performance investigation.
  lead: These notes ask where a task runs and why an interface stalls. They cover threading fundamentals, RunLoop
    and diagnostic techniques. Sketch the possible execution order before returning to the code.
  reading:
  - Read the three threading articles in order. Distinguish tasks, queues, threads and synchronous waits; write
    out possible execution orders for nested calls.
  - Next, examine RunLoop and thread lifetime. Ask when a thread waits and what wakes it, rather than treating a
    persistent thread as a universal fix.
  - Relate stall detection and UIKit tuning to a real workload. Define what you measure, then compare timing, call
    stacks and screen behaviour. Historical measurements are not conclusions about current devices.
- id: data-network
  name: Data & networking
  url: /en/journal/topics/data-network/
  description: Core Data, caching, network requests, messaging, notifications and system services.
  lead: From local storage to remote messages, these notes record approaches to persistence, request wrappers, push
    notifications and instant messaging. Identify the data layer first, then examine what each part of the code
    does.
  reading:
  - For local data, begin with Core Data, archiving and caches. Compare storage formats, update timing and invalidation
    policies; these tools solve different problems.
  - For networking, start with NSURLSession and request architecture, then follow the CocoaAsyncSocket connection
    flow through requests, callbacks, failures and retries.
  - Push notifications, contacts, maps and payment integrations depend on permissions and changing services. After
    reading the historical workflow, consult the provider’s current documentation.
- id: tooling-release
  name: Tools & releases
  url: /en/journal/topics/tooling-release/
  description: CocoaPods, Git, static libraries, Xcode, testing, compatibility and release notes.
  lead: After a feature comes dependencies, builds, tests and releases. These articles preserve older tooling and
    debugging experiences. Use them to trace a problem while distinguishing project configuration from the local
    environment.
  reading:
  - Connect the CocoaPods installation, publishing and static-library articles. Note the tool versions, outputs
    and configuration files in each step.
  - For build and test issues, compare Xcode versions and target systems before following Git fixes or compatibility
    notes. Older plug-in approaches especially need a support check.
  - Review, in-app purchase and release articles explain historical decisions. For an actual submission, use Apple’s
    current rules and your project’s real configuration.
- id: audio-video
  name: Audio & video development
  url: /en/journal/topics/audio-video/
  description: Building FFmpeg, H.264 decoding, capture, streaming and player integration.
  lead: These notes move from FFmpeg build outputs to decoding, camera and microphone capture, streaming and playback.
    Trace the flow of media data before studying each API.
  reading:
  - 'Begin with the FFmpeg-iOS build notes: identify headers, static libraries, target architectures and scripts.
    The original environment and dependencies are historical.'
  - Compare H.264 decoding and capture articles. Note the input format, timing information, decoded data and resource-release
    points.
  - Finally, read streaming wrappers and ijkplayer integration as separate capture, encoding, transport and playback
    stages. Recheck old URLs, protocol settings and dependencies before use.
- id: web-notes
  name: Web & development notes
  url: /en/journal/topics/web-notes/
  description: WebView, JavaScript bridges, mini programs, blog maintenance and development reflections.
  lead: Beyond native apps are web interactions, mini programs and this blog itself. This collection also keeps
    source-code recommendations and retrospectives, preserving both concrete solutions and the path of learning.
  reading:
  - Read WebView basics before JavaScript-to-native calls. Focus on responsibilities and data flow; historical UIWebView
    examples are not current implementation advice.
  - Read the mini-program series in order to understand pages, data and events, then compare it with current tools
    and platform documentation.
  - Read recommendations, blog indexing notes and annual reviews in publication order. They reflect the projects
    and tools of their time; external links and indexing outcomes need a fresh check.
