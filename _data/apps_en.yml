- id: pastel
  name: Aquarell
  guide_intro: Start with brushes and layers, then draw small subjects and learn how to save your work.
  minimum_guides: 40
  verified: 2026-10-22
  tagline: Make room for a little colour.
  description: A drawing app for iPhone and iPad, with custom brushes, layers, palettes and canvas sizes for watercolour-style
    illustrations, sketches and everyday drawing.
  url: /en/apps/aquarell/
  guide_url: /en/guides/aquarell/
  store_url: https://apps.apple.com/cn/app/id1591340577
  icon: /assets/images/apps/pastel.png
  category: Drawing
  os: iOS 15.0+ / iPadOS 15.0+
  version: 1.0.5
  use_cases:
  - Watercolour-style illustrations and sketches
  - Separate line work, colour and details into layers
  - Practise with custom brushes and reusable palettes
  - Export images or a PSD with raster layers
  limits:
  - PSD export preserves raster layers; editable text and groups are not guaranteed. Keep the native project for
    further editing.
  alternate_name: 'Aquarell: Drawing & Watercolor'
- id: man_yue
  name: ManYue
  guide_intro: Import a comic, check offline reading, then connect your own NAS or comic server.
  minimum_guides: 40
  verified: 2026-10-22
  tagline: Your comics, ready for the next chapter.
  description: A comic reader for iPhone and iPad. Import your own files, add sources, or connect a personal library
    through WebDAV, SMB, Komga, Kavita and other supported services.
  url: /en/apps/manyue/
  guide_url: /en/guides/manyue/
  store_url: https://apps.apple.com/cn/app/id6753895889
  icon: /assets/images/apps/man_yue.png
  category: Comics
  os: iOS 15.0+ / iPadOS 15.0+
  version: 2.0.2
  use_cases:
  - Import local CBZ, CBR and PDF comics
  - Read files already imported or downloaded while offline
  - Connect a personal NAS or comic server
  - Organise shelves, bookmarks and reading history
  limits:
  - The app does not supply comics. Some server and sync features require a membership. Ordinary OPDS downloads
    and OPDS-PSE page streaming are different capabilities.
  alternate_name: '漫阅+; ManYue: Manga & Comic Reader'
- id: draw_illustration
  name: VectorPaint
  guide_intro: Build a small icon, learn paths and nodes, then prepare SVG, PNG or PDF files.
  minimum_guides: 40
  verified: 2026-10-22
  tagline: Give a simple shape somewhere to go.
  description: A vector drawing and SVG editing app for iPhone and iPad. Work with shapes, editable paths, layers
    and text to create icons, logos, illustrations and posters.
  url: /en/apps/vectorpaint/
  guide_url: /en/guides/vectorpaint/
  store_url: https://apps.apple.com/cn/app/id1587272880
  icon: /assets/images/apps/draw_illustration.png
  category: Vector design
  os: iOS 17.0+ / iPadOS 17.0+
  version: 1.0.7
  use_cases:
  - Create geometric icons and logos
  - Edit SVG paths and Bézier nodes
  - Combine shapes, text, gradients and layers
  - Export SVG, PDF or PNG and keep an editable original
  limits:
  - SVG and PDF can contain raster images. Exporting does not automatically turn a photo into vectors; tracing results
    depend on the source and colour settings.
  alternate_name: 'VectorPaint: Drawing & SVG'
- id: nas_book
  name: Book Isle
  tagline: A quiet home for your own books.
  description: An ebook reader and personal library app for iPhone and iPad, combining local files, NAS libraries,
    bookmarks, notes, tags and reading-data sync.
  guide_intro: Read a local ebook, organise notes, then connect WebDAV, SMB, OPDS or Calibre.
  minimum_guides: 20
  verified: 2026-10-23
  url: /en/apps/nasbook/
  guide_url: /en/guides/nasbook/
  store_url: https://apps.apple.com/cn/app/id6766198898
  icon: /assets/images/apps/nas_book.png
  category: Ebooks
  os: iOS 15.6+ / iPadOS 15.6+
  version: 1.1.3
  use_cases:
  - Read local TXT, EPUB, PDF and supported documents
  - Connect WebDAV, SMB, OPDS or Calibre libraries
  - Keep bookmarks, notes, tags and reading progress
  - Sync reading data through WebDAV
  limits:
  - No books or online bookstore are included. In the checked version, MOBI, AZW, AZW3, CBR and DJVU mainly support
    management and sync rather than full reading. Reading-data sync does not transfer every book file.
  alternate_name: 书屿
- id: icouldplay
  name: iCouldPlay
  alternate_name: 云映
  tagline: Your videos, with their own place to play.
  description: A video player and personal media library for local files, Photos, NAS folders and supported media
    servers, with metadata, subtitles, audio tracks and playback progress.
  guide_intro: Play a local video, connect your media sources, then check posters, subtitles and playback.
  minimum_guides: 20
  verified: 2026-10-23
  url: /en/apps/icouldplay/
  guide_url: /en/guides/icouldplay/
  store_url: https://apps.apple.com/cn/app/id6755653178
  icon: /assets/images/apps/icouldplay.png
  category: Video & media
  os: iOS 13.0+ / iPadOS 13.0+
  version: 1.1.0
  use_cases:
  - Play local videos and videos from Photos
  - Access SMB, WebDAV and FTP folders
  - Connect Emby, Jellyfin, Plex or UGREEN media servers
  - Organise metadata and check subtitles and audio tracks
  limits:
  - You provide the videos, accounts and servers. Compatibility depends on the file, device and playback engine.
    Poster matching, remote access and offline downloads are separate tasks.
- id: yearn
  name: Yearn
  alternate_name: Yearn - Retro Game Emulator
  tagline: Make time for an old favourite.
  description: A retro game emulator for iPhone and iPad. Organise your own game files, use touch or physical controllers,
    and check save states, display layouts and progress.
  guide_intro: Import your own game, check controls and saves, then explore display and troubleshooting.
  minimum_guides: 20
  verified: 2026-10-23
  url: /en/apps/yearn/
  guide_url: /en/guides/yearn/
  store_url: https://apps.apple.com/cn/app/id6756637059
  icon: /assets/images/apps/yearn.png
  category: Retro games
  os: iOS 17.0+ / iPadOS 17.0+
  version: 1.0.2
  use_cases:
  - Import and organise your own game files
  - Use touch controls or a physical controller
  - Manage save states and verify saved progress
  - Adjust aspect ratio and dual-screen layouts
  limits:
  - No game ROMs are included. Some platforms need a matching BIOS supplied by you. Importing does not guarantee
    compatibility. Save states, in-game saves and cloud sync are different; verify progress before changing devices.
