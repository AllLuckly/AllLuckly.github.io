- id: pastel
  name: Aquarell
  tagline: 把灵感画成一幅水彩插画
  description: Aquarell 是面向 iPhone 和 iPad 的绘画应用，提供自定义笔刷、图层、色板和画布，适合水彩插画、素描速写与日常涂鸦。
  url: /apps/aquarell/
  guide_url: /guides/aquarell/
  store_url: https://apps.apple.com/cn/app/id1591340577
  icon: /assets/images/apps/pastel.png
  category: 绘画与插画
  os: iOS 15.0+ / iPadOS 15.0+
  version: "1.0.5"
  use_cases:
    - 水彩插画与日常速写
    - 分层画线稿、上色与细节
    - 自定义笔刷与配色练习
    - 导出图片或带像素图层的 PSD
  limits: Aquarell 以像素绘画为主；PSD 导出的是像素图层，不能据此认为文字与图层分组仍可编辑。继续创作应保留原生作品，导出图片适合分享。

- id: man_yue
  name: 漫阅+
  tagline: 把自己的漫画书库带在身边
  description: 漫阅是 iPhone 与 iPad 上的漫画阅读器，支持本地漫画、用户添加的漫画源，以及 WebDAV、SMB 和服务器书库。
  url: /apps/manyue/
  guide_url: /guides/manyue/
  store_url: https://apps.apple.com/cn/app/id6753895889
  icon: /assets/images/apps/man_yue.png
  category: 漫画与个人书库
  os: iOS 15.0+ / iPadOS 15.0+
  version: "2.0.2"
  use_cases:
    - 导入 CBZ、CBR、PDF 等本地漫画
    - 离线阅读已导入或已下载的内容
    - 连接个人 WebDAV / SMB 书库
    - 连接 Komga、Kavita 等漫画服务器
  limits: 漫画文件与漫画源由用户自行添加，应用不提供漫画内容。部分 NAS、同步与服务器功能需要会员；普通 OPDS 只有整包下载链接时不能直接逐页阅读，需区分 OPDS-PSE。

- id: draw_illustration
  name: VectorPaint
  tagline: 从第一条路径到可编辑的设计
  description: VectorPaint 是 iPhone 和 iPad 上的矢量绘图与 SVG 编辑工具，用路径、形状、图层和文字创作 Logo、图标、插画与海报。
  url: /apps/vectorpaint/
  guide_url: /guides/vectorpaint/
  store_url: https://apps.apple.com/cn/app/id1587272880
  icon: /assets/images/apps/draw_illustration.png
  category: 矢量与图形设计
  os: iOS 17.0+ / iPadOS 17.0+
  version: "1.0.7"
  use_cases:
    - 用形状与路径设计 Logo 和图标
    - 编辑 SVG 与贝塞尔节点
    - 组合渐变、图层和文字制作插画
    - 导出 SVG、PDF 或透明背景 PNG
  limits: SVG 或 PDF 可以包含作品中的位图元素，导出不会把所有图片自动变成矢量。图片矢量化更适合线稿、标志和平涂图，照片效果取决于原图及颜色数量。
