- id: pastel
  name: Aquarell
  guide_intro: 从画布和笔刷开始，通过具体练习探索色彩、构图与日常插画。
  minimum_guides: 80
  verified: 2026-10-27
  tagline: 把灵感画成一幅水彩插画
  description: Aquarell 是面向 iPhone 和 iPad 的绘画应用，提供自定义笔刷、图层、色板和画布，适合水彩插画、素描速写与日常涂鸦。
  url: /apps/aquarell/
  guide_url: /guides/aquarell/
  store_url: https://apps.apple.com/cn/app/id1591340577
  icon: /assets/images/apps/pastel.png
  category: 绘画与插画
  os: iOS 15.0+ / iPadOS 15.0+
  version: 1.0.6
  use_cases:
  - 水彩插画与日常速写
  - 分层画线稿、上色与细节
  - 自定义笔刷与配色练习
  - 导出图片或带像素图层的 PSD
  limits: Aquarell 以像素绘画为主；PSD 导出的是像素图层，不能据此认为文字与图层分组仍可编辑。继续创作应保留原生作品，导出图片适合分享。
- id: man_yue
  name: 漫阅+
  guide_intro: 导入自己的漫画，安排阅读与书库，再处理远程访问和日常维护。
  minimum_guides: 80
  verified: 2026-10-27
  tagline: 把自己的漫画书库带在身边
  description: 漫阅是 iPhone 与 iPad 上的漫画阅读器，支持本地漫画、用户添加的漫画源，以及 WebDAV、SMB 和服务器书库。
  url: /apps/manyue/
  guide_url: /guides/manyue/
  store_url: https://apps.apple.com/cn/app/id6753895889
  icon: /assets/images/apps/man_yue.png
  category: 漫画与个人书库
  os: iOS 15.0+ / iPadOS 15.0+
  version: 2.0.3
  use_cases:
  - 导入 CBZ、CBR、PDF 等本地漫画
  - 离线阅读已导入或已下载的内容
  - 连接个人 WebDAV / SMB 书库
  - 连接 Komga、Kavita 等漫画服务器
  limits: 漫画文件与漫画源由用户自行添加，应用不提供漫画内容。部分 NAS、同步与服务器功能需要会员；普通 OPDS 只有整包下载链接时不能直接逐页阅读，需区分 OPDS-PSE。
- id: draw_illustration
  name: VectorPaint
  guide_intro: 从形状和路径开始，通过图标、版面和插画练习完成可编辑的设计。
  minimum_guides: 80
  verified: 2026-10-27
  tagline: 从第一条路径到可编辑的设计
  description: VectorPaint 是 iPhone 和 iPad 上的矢量绘图与 SVG 编辑工具，用路径、形状、图层和文字创作 Logo、图标、插画与海报。
  url: /apps/vectorpaint/
  guide_url: /guides/vectorpaint/
  store_url: https://apps.apple.com/cn/app/id1587272880
  icon: /assets/images/apps/draw_illustration.png
  category: 矢量与图形设计
  os: iOS 17.0+ / iPadOS 17.0+
  version: 1.0.8
  use_cases:
  - 用形状与路径设计 Logo 和图标
  - 编辑 SVG 与贝塞尔节点
  - 组合渐变、图层和文字制作插画
  - 导出 SVG、PDF 或透明背景 PNG
  limits: SVG 或 PDF 可以包含作品中的位图元素，导出不会把所有图片自动变成矢量。图片矢量化更适合线稿、标志和平涂图，照片效果取决于原图及颜色数量。
- id: nas_book
  name: 书屿
  tagline: 把个人电子书库整理成随时能读的书架
  description: 书屿是 iPhone 与 iPad 上的个人书库阅读器，可导入本地电子书、连接 WebDAV、SMB、OPDS 和 Calibre，整理书架、阅读进度、书签与笔记，并通过 WebDAV 同步阅读数据。
  guide_intro: 从一本本地电子书开始，连接自己的 NAS 书库，整理笔记与多设备阅读数据。
  minimum_guides: 60
  verified: 2026-10-27
  url: /apps/nasbook/
  guide_url: /guides/nasbook/
  store_url: https://apps.apple.com/cn/app/id6766198898
  icon: /assets/images/apps/nas_book.png
  category: 电子书与 NAS 书库
  os: iOS 15.6+ / iPadOS 15.6+
  version: 1.1.3
  use_cases:
  - 导入 TXT、EPUB、PDF 与自己的文档
  - 连接 NAS、OPDS 或 Calibre 书库
  - 整理书签、笔记、标签与阅读状态
  - 使用 WebDAV 同步阅读数据
  limits: 书屿不提供在线书城或书籍资源。当前核对版本中，MOBI、AZW、AZW3、CBR、DJVU 主要用于导入管理与同步，不能据此认为可以直接阅读；阅读数据同步与书籍文件传输是两件事。
- id: icouldplay
  name: 云映
  alternate_name: iCouldPlay
  tagline: 把本地视频和个人服务器放进同一个播放入口
  description: 云映 iCouldPlay 是 iPhone 与 iPad 上的视频播放器，可导入本地和相册视频，连接 SMB、WebDAV、FTP 及 Emby、Jellyfin、Plex、绿联云视频，并整理媒体信息、字幕与观看进度。
  guide_intro: 从一段本地视频开始，接入个人文件源与媒体服务器，再处理字幕和播放问题。
  minimum_guides: 40
  verified: 2026-10-27
  url: /apps/icouldplay/
  guide_url: /guides/icouldplay/
  store_url: https://apps.apple.com/cn/app/id6755653178
  icon: /assets/images/apps/icouldplay.png
  category: 影音与个人媒体库
  os: iOS 13.0+ / iPadOS 13.0+
  version: 1.1.0
  use_cases:
  - 导入本地或相册中的视频
  - 连接个人 NAS 与媒体服务器
  - 整理电影、剧集和媒体信息
  - 调整字幕、选择可用音轨与排查播放问题
  limits: 视频、账号与服务器由用户自行准备，应用不提供影视资源。格式支持仍受编码、设备与播放引擎影响；海报匹配、远程播放和已下载内容的离线观看需要分别检查。
- id: yearn
  name: Yearn
  alternate_name: Yearn - 复古游戏模拟器
  tagline: 整理自己的复古游戏，接着上次的进度玩
  description: Yearn 是 iPhone 与 iPad 上的复古游戏模拟器，用于导入自备游戏、整理游戏库、使用触屏或实体手柄操作，并管理即时存档与游戏进度。
  guide_intro: 导入自备游戏，设置操控与画面，学会保存进度、同步和兼容排查。
  minimum_guides: 20
  verified: 2026-10-23
  url: /apps/yearn/
  guide_url: /guides/yearn/
  store_url: https://apps.apple.com/cn/app/id6756637059
  icon: /assets/images/apps/yearn.png
  category: 复古游戏与收藏
  os: iOS 17.0+ / iPadOS 17.0+
  version: 1.0.2
  use_cases:
  - 导入并整理自己准备的游戏文件
  - 使用虚拟手柄或连接实体手柄
  - 通过存档槽位保存不同阶段
  - 调整游戏画面比例与双屏布局
  limits: Yearn 不附带游戏 ROM，部分平台需要自行准备匹配的 BIOS。导入成功不代表每款游戏都能正常运行；即时存档、游戏内存档和云端同步需要分别核对，换设备前应确认同一游戏能识别并读取保留的存档。
