_posts/2016-02-29-duoxiancheng03.md:
  updated: '2026-10-23'
  note: >-
    Correction: the section on submitting a task synchronously names dispatch_async, but the
    correct function is dispatch_sync. It returns after the task has completed and may execute
    the task on the current thread. dispatch_once does not take a queue argument and does not
    switch execution to the main thread. For a given static or global token, its block executes
    once during the process's lifetime; concurrent calls wait for that first execution to finish.
    The comment describing the dispatch_apply example as asynchronous is also inaccurate:
    dispatch_apply returns only after all iterations have completed. The original code is
    retained for comparison and has not been rerun.
  references:
    - title: 'Apple: Submitting a task synchronously'
      url: https://developer.apple.com/documentation/dispatch/dispatchqueue/sync%28execute%3A%29-3segw?language=objc
    - title: 'Apple: dispatch_once'
      url: https://developer.apple.com/documentation/dispatch/dispatch_once-c.func
    - title: 'Apple: Dispatch Queues and dispatch_apply'
      url: https://developer.apple.com/library/archive/documentation/General/Conceptual/ConcurrencyProgrammingGuide/OperationQueues/OperationQueues.html
_posts/2017-07-11-ffmpeg1.md:
  updated: '2026-10-23'
  note: >-
    This article records a 2017 build of FFmpeg-iOS using a third-party script. Its terminal output
    reflects the macOS toolchain used at the time. Recheck the script, assembly tools and target
    architectures against your actual environment. The broad permission settings in the original
    article should not be treated as default installation steps either. Only reading references
    have been added here; the build has not been rerun with current Xcode.
  references:
    - title: 'FFmpeg: Build notes for Darwin platforms'
      url: https://ffmpeg.org/platform.html
_posts/2017-07-11-ffmpeg2.md:
  updated: '2026-10-23'
  note: >-
    Calls such as av_register_all and avcodec_decode_video2 belong to the older APIs used in the
    original article. First follow the sequence of demuxing, finding the video stream, decoding
    and releasing resources. To implement decoding with current FFmpeg, consult the send/receive
    API and handle submitting input and repeatedly receiving frames as separate steps. The old
    project has not been recompiled.
  references:
    - title: 'FFmpeg: send/receive encoding and decoding API'
      url: https://ffmpeg.org/doxygen/trunk/group__lavc__encdec.html
_posts/2017-07-12-ffmpeg3.md:
  updated: '2026-10-23'
  note: >-
    This account of muxing dates from 2017. Focus on how encoded data, the output context and the
    streaming workflow fit together. For a current project, check the muxing interfaces, stream
    parameters, time bases and error handling against the FFmpeg version you use, with the official
    muxing documentation as a reference. Neither today's streaming services nor the original
    project have been tested again for this article.
  references:
    - title: 'FFmpeg: Muxing and output streams'
      url: https://ffmpeg.org/doxygen/trunk/group__lavf__encoding.html
_posts/2017-07-20-ffmpeg4.md:
  updated: '2026-10-23'
  note: >-
    The original article presents FFmpeg device input alongside iOS capture code using
    AVCaptureSession. When repeating the experiment, check device selection, input formats and
    application permissions separately. Do not apply desktop device indices directly to a phone.
    Consult the official device documentation for avfoundation options. These examples have not
    been revalidated on current devices.
  references:
    - title: 'FFmpeg: avfoundation input device'
      url: https://ffmpeg.org/ffmpeg-devices.html#avfoundation
