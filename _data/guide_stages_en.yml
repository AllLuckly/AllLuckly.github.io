  start: 16
  end: 20
  description: Check reading-data sync, audiobooks, statistics, app lock and export.
- id: file-reading-checks
  title: Files and reading checks
  start: 21
  end: 25
  description: Import in batches and prepare reliable text and illustrated copies for travel and different screens.
- id: formats-editions
  title: Formats and editions
  start: 26
  end: 30
  description: Manage scans, converted copies, revisions and series while retaining a route back to originals.
- id: notes-reading-methods
  title: Notes and reading methods
  start: 31
  end: 35
  description: Build review routes and comparisons, proofread quotes, diagnose search and reflect on a month of
    reading.
- id: remote-maintenance-migration
  title: Remote libraries and migration
  start: 36
  end: 40
  description: Diagnose downloads, changed addresses and Calibre paths, then verify device handoffs and restoration.
- id: close-reading-practice
  title: Reading and note practice
  start: 41
  end: 45
  description: Resume interrupted reading, investigate a chapter, track characters and selected pieces, and distinguish
    new reflections.
- id: document-quality-checks
  title: Document quality checks
  start: 46
  end: 50
  description: Inspect tables, web resources, column order, poetry line breaks and plain-text paragraphs.
- id: source-quality-checks
  title: Library source checks
  start: 51
  end: 55
  description: Check read-only access, OPDS records, translations, large scans and source provenance.
- id: reference-and-archive
  title: Reference and archiving
  start: 56
  end: 60
  description: Connect indexes, figures and quotation sources, reduce unread lists and archive project references.
- id: claims-and-reading-context
  title: Claims and reading context
  start: 61
  end: 65
  description: Inspect statistical claims, evidence and references, track terms across chapters and compare prefaces.
- id: editions-and-evidence
  title: Editions and reading evidence
  start: 66
  end: 70
  description: Compare annotated editions, plays and series, identify voices and assemble a personal evidence portfolio.
- id: worked-evidence-checks
  title: Worked examples, places and corrections
  start: 71
  end: 75
  description: Check worked mathematics, places and dates, map errata and trace an appendix algorithm by hand.
- id: parallel-and-format-reading
  title: Parallel reading and format checks
  start: 76
  end: 80
  description: Compare parallel languages and audio with text, then inspect FB2, RTF and Markdown content structure.
icouldplay:
- id: files
  title: Local files & sources
