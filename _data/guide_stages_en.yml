pastel:
- id: canvas-brush
  title: Canvas & brushes
  start: 1
  end: 4
  description: Choose a canvas size, then explore brush size, opacity and spacing with simple marks.
- id: layers-color
  title: Layers & colour
  start: 5
  end: 8
  description: Separate sketches, colour and details, and build a palette you can reuse.
- id: practice
  title: Small drawing projects
  start: 9
  end: 14
  description: Begin with leaves and flowers, then practise volume, landscapes and composition.
- id: save-refine
  title: Saving & further editing
  start: 15
  end: 20
  description: Choose an export format, keep an editable original and try adjustments inside a selection.
- id: mark-making
  title: Marks, light & shade
  start: 21
  end: 25
  description: Use hatching, stippling, negative space and hard or soft edges to study light and colour temperature.
- id: light-material
  title: Light & materials
  start: 26
  end: 30
  description: Paint a night window, rainy reflections, waves, clouds and fabric folds to build tonal depth.
- id: everyday-subjects
  title: Everyday subjects
  start: 31
  end: 35
  description: Turn observations of breakfast, mushrooms, cats, moths and street corners into pictures.
- id: observation-story
  title: Observation & storytelling
  start: 36
  end: 40
  description: Practise a portrait, hands, clear glass and seed pods, then finish a four-panel story.
- id: natural-structures
  title: Natural structures & repeated detail
  start: 41
  end: 45
  description: Study cones, cacti, birds, koi and shells, wrapping repeated details around their forms.
- id: food-materials
  title: Food & everyday materials
  start: 46
  end: 50
  description: Compare strawberries, lemon, pastry, reflective metal and wicker through structure, light and texture.
- id: scenes-space
  title: Scenes & space
  start: 51
  end: 55
  description: Explore distance, reflections, snow, dunes and a room organised with one vanishing point.
- id: editorial-review
  title: Illustration, lettering & review
  start: 56
  end: 60
  description: Design a travel journal, recipe and botanical initial, paint a seasonal series and review your process.
- id: objects-connections
  title: Objects & connections
  start: 61
  end: 65
  description: Draw a crane, umbrella, wheel, sneaker and headphones through planes, axes and overlaps.
- id: natural-density
  title: Natural forms & density
  start: 66
  end: 70
  description: Explore a dandelion, snail, dragonfly, succulent and grapes, relating repeated detail to growth and
    volume.
- id: material-light
  title: Materials & light
  start: 71
  end: 75
  description: Compare wood, eggshell, honey, soap film and candlelight through texture, thickness and transmission.
- id: scenes-explanations
  title: Scenes & visual explanations
  start: 76
  end: 80
  description: Paint a fruit stall, waterfall, arch bridge, game path and exploded toy to explain space and sequence.
- id: continuous-objects
  title: Continuous structures & objects
  start: 81
  end: 85
  description: Draw a rope knot, knight, book stack, folded map and zipper through paths, surfaces and connections.
- id: living-scene-layers
  title: Living forms & scene layers
  start: 86
  end: 90
  description: Explore jellyfish, an octopus arm, a beetle, a paper lantern and curtains through transparency, shell,
    light and framing.
- id: mechanisms-orientation
  title: Object orientation & connections
  start: 91
  end: 95
  description: Draw a clock, camera, glasses, keyring and pliers, checking time, shared axes and connected parts.
- id: networks-forms-sections
  title: Networks, forms & sections
  start: 96
  end: 100
  description: Study a dewy web, bat, seahorse, seed head and miniature section through direction and layered structure.
man_yue:
- id: first-book
  title: Import your first comic
  start: 1
  end: 4
  description: Start with one local file and check its format, contents and page order.
- id: reading-library
  title: Reading & shelves
  start: 5
  end: 9
  description: Organise the bookshelf, adjust reading and check that downloads are complete before going offline.
- id: server-library
  title: Connect a server library
  start: 10
  end: 14
  description: Choose the connection supported by your server, then verify the catalogue, pages and local copies.
- id: sync-maintenance
  title: Sync, move & troubleshoot
  start: 15
  end: 20
  description: Check one condition at a time. Separate reading data from comic files before changing devices or
    clearing storage.
- id: sources
  title: More ways to import
  start: 21
  end: 25
  description: Explore Wi-Fi import, your own sources, combined search and update tracking.
- id: reading-list
  title: Your reading list
  start: 26
  end: 30
  description: Organise the to-read list, history, chapter search and favourites for a library you use over time.
- id: more-libraries
  title: Servers & page layouts
  start: 31
  end: 35
  description: Check additional personal servers and ways to read PDF and vertical-scroll comics.
- id: tools-records
  title: Reading tools & records
  start: 36
  end: 40
  description: Adjust controls and appearance, and work with exports, statistics and reading progress.
- id: local-file-checks
  title: Local file checks
  start: 41
  end: 45
  description: Use numbered samples, volume names and edition comparisons to inspect large images, multipart archives
    and file structure.
- id: reading-precision
  title: Reading precision and rereading
  start: 46
  end: 50
  description: Check cover pairing, mixed pages and small lettering, build scene anchors and verify automatic-reading
    pauses.
- id: server-upkeep
  title: NAS and server upkeep
  start: 51
  end: 55
  description: Verify folder moves, access permissions, HTTPS paths, home and remote routes, and positions after
    a server rescan.
- id: long-term-library
  title: Devices and long-term care
  start: 56
  end: 60
  description: Test device handoffs, rehearse recovery, budget offline storage, change sources and audit a personal
    library.
- id: reader-scopes
  title: Reader scope and image width
  start: 61
  end: 65
  description: Isolate book and device preferences, roll back overrides, and inspect vertical width and wide-image
    splitting.
- id: layout-calibration
  title: Layout calibration and detail
  start: 66
  end: 70
  description: Calibrate smart pairing, orientation counts, automatic layout, zoom focus and page-turn effects.
- id: reader-tools
  title: Reader tools and interaction
  start: 71
  end: 75
  description: Configure status information, reminders, chapter transitions, source comments and quick image collection.
- id: source-specific-checks
  title: Loading and source-specific checks
  start: 76
  end: 80
  description: Compare preloading and verify LANraragi, Ubooquity, catalogue scope and tracker mappings.
- id: visual-reading-evidence
  title: Visual reading and evidence
  start: 81
  end: 85
  description: Inspect wordless actions, page-turn reveals, panel references, scene geography and the source of
    lettering.
- id: serial-and-file-evidence
  title: Serial continuity and file checks
  start: 86
  end: 90
  description: Build a chapter recap and inspect transparent pages, orientation, companion files and tall-image
    seams.
- id: narrative-context-checks
  title: Narrative and context checks
  start: 91
  end: 95
  description: Separate flashbacks and parallel strands, then inspect recurring images, testimony and maps inside
    the work.
- id: edition-studies-sharing
  title: Edition studies and sharing
  start: 96
  end: 100
  description: Compare bilingual lines, screentones and page edges; verify credits and write recommendations within
    reading boundaries.
draw_illustration:
- id: shapes
  title: Canvas & basic shapes
  start: 1
  end: 4
  description: Start with a small icon and learn dimensions, geometric shapes, fills and strokes.
- id: paths-objects
  title: Paths & object organisation
  start: 5
  end: 9
  description: Practise curves and nodes, then organise the composition with layers, alignment and guides.
- id: type-materials
  title: Type, colour & assets
  start: 10
  end: 15
  description: Combine text, gradients and masks, and understand the limits of imported images and tracing.
- id: export-practice
  title: Export & complete projects
  start: 16
  end: 20
  description: Choose a delivery format, finish icon and poster exercises and keep an editable original.
- id: graphic-series
  title: Graphic families
  start: 21
  end: 25
  description: Create weather icons, route maps, repeating patterns and signs with a consistent visual language.
- id: visual-explanations
  title: Illustration & information
  start: 26
  end: 30
  description: Use greeting cards, cartons, bar charts, timelines and step diagrams to explain an idea.
- id: type-color-practice
  title: Type & colour practice
  start: 31
  end: 35
  description: Compare wordmark spacing, bilingual hierarchy, contour lines, transparent colour and product cards.
- id: delivery-checks
  title: Applications & delivery
  start: 36
  end: 40
  description: Check designs as wallpaper, avatars, stickers and print samples, then organise logo deliverables.
- id: information-layouts
  title: Information & layouts
  start: 41
  end: 45
  description: Create tickets, editorial covers, menus, comparison sheets and flowcharts with clear information
    hierarchies.
- id: spatial-components
  title: Space & components
  start: 46
  end: 50
  description: Use room layouts, exploded diagrams, vehicles, ribbons and clock faces to practise references, stacking
    and repeated objects.
- id: curves-silhouettes
  title: Curves & silhouettes
  start: 51
  end: 55
  description: Draw fish, feathers, sailboats, lanterns and bicycles while controlling nodes, direction, gaps and
    detail density.
- id: adaptation-maintenance
  title: Adaptation & maintenance
  start: 56
  end: 60
  description: Check small icons, image ratios, SVG rendering and font appearance, then organise editable sources
    and backups.
- id: practical-records
  title: Practical record layouts
  start: 61
  end: 65
  description: Create recipe records, checklists, score sheets, paired flashcards and seating plans, checking fields
    and identifiers.
- id: relationships-data
  title: Relationships and data
  start: 66
  end: 70
  description: Use sets, shares, areas, matrices and hierarchies to verify data scope, geometry and legends.
- id: structure-scenes
  title: Structure and scenes
  start: 71
  end: 75
  description: Build detail callouts, paper-cut scenes, woven strips, origami cranes and day/night diptychs with
    coherent structure.
- id: output-content-adaptation
  title: Output and content adaptation
  start: 76
  end: 80
  description: Check gradient proofs, cast shadows, subtitle backplates, folded leaflets and monochrome versions
    in their intended uses.
- id: graphic-rules-expression
  title: Graphic rules and visual expression
  start: 81
  end: 85
  description: Use geometric puzzles, mazes, dialogue balloons, compass roses and negative space to check rules,
    directions and shared boundaries.
- id: continuity-graphic-families
  title: Continuity and graphic families
  start: 86
  end: 90
  description: Build word squares, action lines, line charts, expression families and continuous spine artwork while
    preserving content-to-graphic correspondence.
- id: data-and-rule-studies
  title: Data and rule graphics
  start: 91
  end: 95
  description: Use scatterplots, cumulative waterfalls, task intervals, a windowed dial and cyclic overlaps to check
    values, states and stacking relationships.
- id: component-structure-checks
  title: Structure and component checks
  start: 96
  end: 100
  description: Build stencil bridges, hidden-edge wireframes, a zipper, board positions and a six-face net, checking
    components, coordinates and adjacency.
nas_book:
- id: first-book
  title: Start reading
  start: 1
  end: 5
  description: Import an ebook and check layout, contents, search and position for its format.
- id: organize-notes
  title: Organisation & notes
  start: 6
  end: 10
  description: Manage metadata, tags and formats, then try highlights, notes and search.
- id: private-library
