pastel:
- id: canvas-brush
  title: Canvas & brushes
  start: 1
  end: 4
  description: Choose a canvas size, then explore brush size, opacity and spacing with simple marks.
- id: layers-color
  title: Layers & colour
  start: 5
  end: 8
  description: Separate sketches, colour and details, and build a palette you can reuse.
- id: practice
  title: Small drawing projects
  start: 9
  end: 14
  description: Begin with leaves and flowers, then practise volume, landscapes and composition.
- id: save-refine
  title: Saving & further editing
  start: 15
  end: 20
  description: Choose an export format, keep an editable original and try adjustments inside a selection.
- id: mark-making
  title: Marks, light & shade
  start: 21
  end: 25
  description: Use hatching, stippling, negative space and hard or soft edges to study light and colour temperature.
- id: light-material
  title: Light & materials
  start: 26
  end: 30
  description: Paint a night window, rainy reflections, waves, clouds and fabric folds to build tonal depth.
- id: everyday-subjects
  title: Everyday subjects
  start: 31
  end: 35
  description: Turn observations of breakfast, mushrooms, cats, moths and street corners into pictures.
- id: observation-story
  title: Observation & storytelling
  start: 36
  end: 40
  description: Practise a portrait, hands, clear glass and seed pods, then finish a four-panel story.
- id: natural-structures
  title: Natural structures & repeated detail
  start: 41
  end: 45
  description: Study cones, cacti, birds, koi and shells, wrapping repeated details around their forms.
- id: food-materials
  title: Food & everyday materials
  start: 46
  end: 50
  description: Compare strawberries, lemon, pastry, reflective metal and wicker through structure, light and texture.
- id: scenes-space
  title: Scenes & space
  start: 51
  end: 55
  description: Explore distance, reflections, snow, dunes and a room organised with one vanishing point.
- id: editorial-review
  title: Illustration, lettering & review
  start: 56
  end: 60
  description: Design a travel journal, recipe and botanical initial, paint a seasonal series and review your process.
- id: objects-connections
  title: Objects & connections
  start: 61
  end: 65
  description: Draw a crane, umbrella, wheel, sneaker and headphones through planes, axes and overlaps.
- id: natural-density
  title: Natural forms & density
  start: 66
  end: 70
  description: Explore a dandelion, snail, dragonfly, succulent and grapes, relating repeated detail to growth and
    volume.
- id: material-light
  title: Materials & light
  start: 71
  end: 75
  description: Compare wood, eggshell, honey, soap film and candlelight through texture, thickness and transmission.
- id: scenes-explanations
  title: Scenes & visual explanations
  start: 76
  end: 80
  description: Paint a fruit stall, waterfall, arch bridge, game path and exploded toy to explain space and sequence.
- id: continuous-objects
  title: Continuous structures & objects
  start: 81
  end: 85
  description: Draw a rope knot, knight, book stack, folded map and zipper through paths, surfaces and connections.
- id: living-scene-layers
  title: Living forms & scene layers
  start: 86
  end: 90
  description: Explore jellyfish, an octopus arm, a beetle, a paper lantern and curtains through transparency, shell,
    light and framing.
- id: mechanisms-orientation
  title: Object orientation & connections
  start: 91
  end: 95
  description: Draw a clock, camera, glasses, keyring and pliers, checking time, shared axes and connected parts.
- id: networks-forms-sections
  title: Networks, forms & sections
  start: 96
  end: 100
  description: Study a dewy web, bat, seahorse, seed head and miniature section through direction and layered structure.
- id: flow-folds-thin-edges
  title: Flow, folds & thin edges
  start: 101
  end: 105
  description: Draw an hourglass, folding fan, stamp edge, curled shaving and barrel, checking routes, planes, notches
    and material connections.
- id: growth-patterns-waterlines
  title: Growth patterns & waterlines
  start: 106
  end: 110
  description: Study a calla lily, giraffe, fern, six-armed snowflake and floating toy through curls, turning surfaces,
    hierarchy, repetition and water occlusion.
- id: games-sports-trails
  title: Games, sports & trails
  start: 111
  end: 115
  description: Draw a die, tennis ball, shuttlecock, kite and footprints, checking patterns, seams, cones, connections
    and alternating sides.
- id: street-objects-support
  title: Street objects & support
  start: 116
  end: 120
  description: Study a traffic cone, hydrant, mailbox, bench and escalator through bands, openings, outlets and
    support routes.
- id: instrument-construction
  title: Instrument construction
  start: 121
  end: 125
  description: Draw keys, violin, trumpet, tambourine and accordion, checking counts, support, tubing and folded-surface
    connections.
- id: food-layers-texture
  title: Food layers & texture
  start: 126
  end: 130
  description: Study corn, dumpling, waffle, cabbage and garlic through wrapping rows, closed seams, recesses, leaf
    layers and papery skin.
- id: connected-objects-occlusion
  title: Connected objects and occlusion
  start: 131
  end: 135
  description: Draw a four-bladed pinwheel, spool, closed safety pin, belt buckle and stapler, checking continuous
    paths, holes and shared hinges.
- id: animal-limbs-support
  title: Animal limbs and support
  start: 136
  end: 140
  description: Study shore crab, water strider, chameleon, parrot and ochre sea star through limb counts, digit
    groups, visible contacts and upper-versus-underside boundaries.
- id: wire-fold-opening-connections
  title: Wire paths, folds and openings
  start: 141
  end: 145
  description: Draw a spiral notebook, paper bag, whisk, iron and padlock, checking hole order, folded surfaces,
    negative spaces and closed shackle entries.
- id: peels-pods-plant-branching
  title: Peels, pods and plant branching
  start: 146
  end: 150
  description: Study banana, pea pod, pomegranate, ginger and bok choy through surface reversal, containment, membranes,
    rhizome branching and stalk–blade pairing.
- id: everyday-support-nesting
  title: Everyday support and nesting
  start: 151
  end: 155
  description: Draw a tape dispenser, binder clip, clothespin, hand-crank sharpener and dripper, checking material
    paths, shared axes, grips and nested paper.
- id: plant-coverings-openings-heads
  title: Plant coverings, openings and flower heads
  start: 156
  end: 160
  description: Study acorn, coconut half, paired samaras, monstera and sunflower through enclosure, tissue order,
    pairing, negative-space connectivity and floral groups.
- id: shared-rail-threading-junctions
  title: Shared rails, threading and junctions
  start: 161
  end: 165
  description: Draw caliper, four-hole button, rain boot, bicycle frame and thimble, checking rails, hole occlusion,
    continuous form, tube nodes and dimples.
- id: bundles-tubes-wing-leaf-pairs
  title: Bundles, tubes and paired organs
  start: 166
  end: 170
  description: Study loblolly pine, foxglove, barn swallow, penguin and Venus flytrap through shared bases, flower
    mouths, two wings, belly turning and paired leaf lobes.
- id: rotating-sliding-material-layers
  title: Rotating parts, sliders and material layers
  start: 171
  end: 175
  description: Draw a telephone dial, metronome, empty sliding box, honeycomb sandwich and paint tube, checking
    fixed parts, rod enclosure, nesting, three layers and collapse.
- id: plant-pathways-animal-attachments
  title: Plant pathways and animal attachments
  start: 176
  end: 180
  description: Study ginkgo, strawberry runners, mantis, African elephant and banyan through branching veins, crowns,
    six legs, trunk and tusks, and branch-to-ground roots.
- id: helices-nesting-threaded-connections
  title: Helices, nesting and threaded connections
  start: 181
  end: 185
  description: Draw a corkscrew, ring binder, nested cups, tripod and needle threader to inspect continuity, pairing,
    ownership and passage.
- id: leaves-nodes-compound-organs
  title: Leaves, nodes and compound organs
  start: 186
  end: 190
  description: Draw English oak, horsetail, lily, market squid and pineapple to check blades, whorls, floral organs,
    eight-plus-two and compound fruit surfaces.
man_yue:
- id: first-book
  title: Import your first comic
  start: 1
  end: 4
  description: Start with one local file and check its format, contents and page order.
- id: reading-library
  title: Reading & shelves
  start: 5
  end: 9
  description: Organise the bookshelf, adjust reading and check that downloads are complete before going offline.
- id: server-library
  title: Connect a server library
  start: 10
  end: 14
  description: Choose the connection supported by your server, then verify the catalogue, pages and local copies.
- id: sync-maintenance
  title: Sync, move & troubleshoot
  start: 15
  end: 20
  description: Check one condition at a time. Separate reading data from comic files before changing devices or
    clearing storage.
- id: sources
  title: More ways to import
  start: 21
  end: 25
  description: Explore Wi-Fi import, your own sources, combined search and update tracking.
- id: reading-list
  title: Your reading list
  start: 26
  end: 30
  description: Organise the to-read list, history, chapter search and favourites for a library you use over time.
- id: more-libraries
  title: Servers & page layouts
  start: 31
  end: 35
  description: Check additional personal servers and ways to read PDF and vertical-scroll comics.
- id: tools-records
  title: Reading tools & records
  start: 36
  end: 40
  description: Adjust controls and appearance, and work with exports, statistics and reading progress.
- id: local-file-checks
  title: Local file checks
  start: 41
  end: 45
  description: Use numbered samples, volume names and edition comparisons to inspect large images, multipart archives
    and file structure.
- id: reading-precision
  title: Reading precision and rereading
  start: 46
  end: 50
  description: Check cover pairing, mixed pages and small lettering, build scene anchors and verify automatic-reading
    pauses.
- id: server-upkeep
  title: NAS and server upkeep
  start: 51
  end: 55
  description: Verify folder moves, access permissions, HTTPS paths, home and remote routes, and positions after
    a server rescan.
- id: long-term-library
  title: Devices and long-term care
  start: 56
  end: 60
  description: Test device handoffs, rehearse recovery, budget offline storage, change sources and audit a personal
    library.
- id: reader-scopes
  title: Reader scope and image width
  start: 61
  end: 65
  description: Isolate book and device preferences, roll back overrides, and inspect vertical width and wide-image
    splitting.
- id: layout-calibration
  title: Layout calibration and detail
  start: 66
  end: 70
  description: Calibrate smart pairing, orientation counts, automatic layout, zoom focus and page-turn effects.
- id: reader-tools
  title: Reader tools and interaction
  start: 71
  end: 75
  description: Configure status information, reminders, chapter transitions, source comments and quick image collection.
- id: source-specific-checks
  title: Loading and source-specific checks
  start: 76
  end: 80
  description: Compare preloading and verify LANraragi, Ubooquity, catalogue scope and tracker mappings.
- id: visual-reading-evidence
  title: Visual reading and evidence
  start: 81
  end: 85
  description: Inspect wordless actions, page-turn reveals, panel references, scene geography and the source of
    lettering.
- id: serial-and-file-evidence
  title: Serial continuity and file checks
  start: 86
  end: 90
  description: Build a chapter recap and inspect transparent pages, orientation, companion files and tall-image
    seams.
- id: narrative-context-checks
  title: Narrative and context checks
  start: 91
  end: 95
  description: Separate flashbacks and parallel strands, then inspect recurring images, testimony and maps inside
    the work.
- id: edition-studies-sharing
  title: Edition studies and sharing
  start: 96
  end: 100
  description: Compare bilingual lines, screentones and page edges; verify credits and write recommendations within
    reading boundaries.
- id: panels-visual-judgements
  title: Panels and visual judgements
  start: 101
  end: 105
  description: Check inset panels, scene duration, character identity, motion symbols and the conditions for comparing
    scale.
- id: evidence-review-boundaries
  title: Evidence and review boundaries
  start: 106
  end: 110
  description: Inspect documentary reconstruction, instructions and board scenes, then separate cover information
    and prepare an original-draft review.
- id: image-expression-cues
  title: Image and expression cues
  start: 111
  end: 115
  description: Check emotional backgrounds, border breaks, dense-panel order, dialogue lettering and cutaway explanatory
    layers.
- id: legends-routes-records
  title: Legends, routes and written records
  start: 116
  end: 120
  description: Audit pictograms and colour cues, then build branching routes, descriptions and balloon-correction
    records.
- id: storage-local-reading
  title: Storage and local reading in the current release
  start: 121
  end: 125
  description: Read storage categories and image-cache scope; check PDF colours, reopening states and direct local
    reading from Home.
- id: visual-evidence-conditions
  title: Visual evidence and condition checks
  start: 126
  end: 130
  description: Use mirrors, shadows, forms, calendars and visual riddles to practise attribution, conditions and
    uncertainty.
- id: file-identity-reading-scope
  title: File identity and reading scope
  start: 131
  end: 135
  description: Check archive integrity, suspected duplicate pages, PDF annotations, container identity and attachments
    with separate evidence layers.
- id: in-story-data-claims
  title: In-story data and claims
  start: 136
  end: 140
  description: Read bar and pie charts, experiment scenes, surveys and price signs while separating values, units,
    conditions and character claims.
- id: archive-metadata-access-evidence
  title: Archive, metadata and access evidence
  start: 141
  end: 145
  description: Distinguish duplicate ZIP paths, ComicInfo metadata, URI components and OPDS link roles, then prepare
    a minimal reproduction.
- id: visual-layers-identifier-rules
  title: Visual layers and identifier rules
  start: 146
  end: 150
  description: Check imagined branches, collage regions, insect occlusion, parts versus steps and scoreboard scope
    while preserving uncertainty.
- id: archive-display-response-audit
  title: Archives, display and access responses
  start: 151
  end: 155
  description: Check compression methods, name collisions, PDF fonts, per-resource WebDAV status and relative OPDS
    links.
- id: diagram-relationship-time-reading
  title: Diagram relationships and time records
  start: 156
  end: 160
  description: Read heatmap cells, tree relationships, midnight-crossing times, flowchart branches and multiple
    object views.
- id: reading-order-path-protocol-identifiers
  title: Reading order, paths and protocol identifiers
  start: 161
  end: 165
  description: Compare EPUB order, Wi-Fi folder previews, PDF labels, download names and PSE templates to check
    identity and scope.
- id: pictured-symbols-combined-relations
  title: Pictured symbols and combined relationships
  start: 166
  end: 170
  description: Read clock faces, balances, overlapping sets, logic gates and crossword grids while retaining assumptions
    and limits.
- id: container-fields-catalogue-boundaries
  title: Container fields and catalogue boundaries
  start: 171
  end: 175
  description: Check PDF boxes, ZIP64 fields, PNG density, EPUB identifiers and OPDS pagination, separating metadata
    from actual reading.
- id: structural-relations-quantity-reading
  title: Structural relationships and quantities
  start: 176
  end: 180
  description: Read cube nets, relative strata ages, coordinate paths, gear trains and RGB wheels through explicit
    assumptions and relationships.
- id: file-representations-entry-addresses
  title: File representations and entry addresses
  start: 181
  end: 185
  description: Check PDF rotation, JPEG scans, PNG colour types, EPUB root paths and HTTP coding layers while retaining
    actual import results.
- id: natural-diagrams-connection-relations
  title: Natural diagrams and connection relationships
  start: 186
  end: 190
  description: Read Moon phases, meanders, coordinate grids, food webs and paper circuits through viewpoints, directions,
    models and connectivity.
draw_illustration:
- id: shapes
  title: Canvas & basic shapes
  start: 1
  end: 4
  description: Start with a small icon and learn dimensions, geometric shapes, fills and strokes.
- id: paths-objects
  title: Paths & object organisation
  start: 5
  end: 9
  description: Practise curves and nodes, then organise the composition with layers, alignment and guides.
- id: type-materials
  title: Type, colour & assets
  start: 10
  end: 15
  description: Combine text, gradients and masks, and understand the limits of imported images and tracing.
- id: export-practice
  title: Export & complete projects
  start: 16
  end: 20
  description: Choose a delivery format, finish icon and poster exercises and keep an editable original.
- id: graphic-series
  title: Graphic families
  start: 21
  end: 25
  description: Create weather icons, route maps, repeating patterns and signs with a consistent visual language.
- id: visual-explanations
  title: Illustration & information
  start: 26
  end: 30
  description: Use greeting cards, cartons, bar charts, timelines and step diagrams to explain an idea.
- id: type-color-practice
  title: Type & colour practice
  start: 31
  end: 35
  description: Compare wordmark spacing, bilingual hierarchy, contour lines, transparent colour and product cards.
- id: delivery-checks
  title: Applications & delivery
  start: 36
  end: 40
  description: Check designs as wallpaper, avatars, stickers and print samples, then organise logo deliverables.
- id: information-layouts
  title: Information & layouts
  start: 41
  end: 45
  description: Create tickets, editorial covers, menus, comparison sheets and flowcharts with clear information
    hierarchies.
- id: spatial-components
  title: Space & components
  start: 46
  end: 50
  description: Use room layouts, exploded diagrams, vehicles, ribbons and clock faces to practise references, stacking
    and repeated objects.
- id: curves-silhouettes
  title: Curves & silhouettes
  start: 51
  end: 55
  description: Draw fish, feathers, sailboats, lanterns and bicycles while controlling nodes, direction, gaps and
    detail density.
- id: adaptation-maintenance
  title: Adaptation & maintenance
  start: 56
  end: 60
  description: Check small icons, image ratios, SVG rendering and font appearance, then organise editable sources
    and backups.
- id: practical-records
  title: Practical record layouts
  start: 61
  end: 65
  description: Create recipe records, checklists, score sheets, paired flashcards and seating plans, checking fields
    and identifiers.
- id: relationships-data
  title: Relationships and data
  start: 66
  end: 70
  description: Use sets, shares, areas, matrices and hierarchies to verify data scope, geometry and legends.
- id: structure-scenes
  title: Structure and scenes
  start: 71
  end: 75
  description: Build detail callouts, paper-cut scenes, woven strips, origami cranes and day/night diptychs with
    coherent structure.
- id: output-content-adaptation
  title: Output and content adaptation
  start: 76
  end: 80
  description: Check gradient proofs, cast shadows, subtitle backplates, folded leaflets and monochrome versions
    in their intended uses.
- id: graphic-rules-expression
  title: Graphic rules and visual expression
  start: 81
  end: 85
  description: Use geometric puzzles, mazes, dialogue balloons, compass roses and negative space to check rules,
    directions and shared boundaries.
- id: continuity-graphic-families
  title: Continuity and graphic families
  start: 86
  end: 90
  description: Build word squares, action lines, line charts, expression families and continuous spine artwork while
    preserving content-to-graphic correspondence.
- id: data-and-rule-studies
  title: Data and rule graphics
  start: 91
  end: 95
  description: Use scatterplots, cumulative waterfalls, task intervals, a windowed dial and cyclic overlaps to check
    values, states and stacking relationships.
- id: component-structure-checks
  title: Structure and component checks
  start: 96
  end: 100
  description: Build stencil bridges, hidden-edge wireframes, a zipper, board positions and a six-face net, checking
    components, coordinates and adjacency.
- id: curves-articulated-structures
  title: Curves and articulated structures
  start: 101
  end: 105
  description: Draw a butterfly, articulated lamp, umbrella, cup cutaway and horse-head piece, checking contours,
    attachments and openings.
- id: repetition-correspondence-rules
  title: Repetition and correspondence rules
  start: 106
  end: 110
  description: Use line gratings, two-flag codes, paired stair views, region colouring and sixfold rosettes to audit
    repetition, adjacency and correspondence.
- id: symbols-continuous-structures
  title: Symbols and continuous structures
  start: 111
  end: 115
  description: Build seven-segment digits, accordion strips, chain links, helices and ruler scales, checking positions,
    joins and repeat spacing.
- id: quantity-spatial-rules
  title: Quantity and spatial rules
  start: 116
  end: 120
  description: Use histogram bins, flow bands, globe grids, pip tiles and Latin squares to audit boundaries, quantities,
    directions and row/column constraints.
- id: spatial-object-connections
  title: Spatial construction and object connections
  start: 121
  end: 125
  description: Use a one-point corridor, ellipse foci, equal-pulley belt, four-hole thread and hinged-lid poses
    to check direction, tangency and attachment.
- id: quantity-logic-paths
  title: Quantity, logic and paths
  start: 126
  end: 130
  description: Build unit pictograms, truth cards, medians, fraction walls and weighted routes, checking units,
    conditions, ratios and candidates.
- id: object-connections-unfolding
  title: Object connections and unfolding
  start: 131
  end: 135
  description: Connect book pages, bridge components and paired gears, then check a cylinder unfolding and shared-pivot
    scissors states.
- id: number-encodings-constraints
  title: Number encodings and constrained graphics
  start: 136
  end: 140
  description: Build stem-and-leaf displays, abacus cards, a nonogram, a replacement-draw tree and equal-perimeter
    rectangles, checking encoding and conditions.
- id: outlines-structures-nets
  title: Outlines, structures and unfolding
  start: 141
  end: 145
  description: Check nested tubes, envelope layers, ginkgo branching, chambered shells and cone nets through overlaps,
    boundaries and correspondence.
- id: geometry-discrete-constructions
  title: Geometric construction and discrete rules
  start: 146
  end: 150
  description: Build bisectors, coordinate transforms, box plots, edge-once trails and Pascal triangles, independently
    checking each condition.
- id: arcs-dissection-constructions
  title: Arcs and dissection constructions
  start: 151
  end: 155
  description: Construct Reuleaux arcs, an Archimedean spiral, two-round triangular cutouts, a three-four-five square
    and a shear dissection, checking arcs, areas and coordinates.
- id: projections-networks-steps
  title: Projections, networks and steps
  start: 156
  end: 160
  description: Build unit-circle projections, factor trees, dependency graphs, a Gray-code cycle and an empirical
    distribution, declaring signed components, multiplicity, precedence and endpoint conditions.
- id: object-connections-sections
  title: Object connections and sectional diagrams
  start: 161
  end: 165
  description: Use nib, calendar, nut, hourglass and paper-staple diagrams to check openings, pairing, cavities
    and sectional conventions.
- id: discrete-geometric-rules
  title: Discrete counting and geometric rules
  start: 166
  end: 170
  description: Construct honeycomb cells, Koch segments, a parabola, a minimum spanning connection and a magic square,
    independently checking edges, lengths, distances, weights and constraints.
- id: wire-hinge-passage-studies
  title: Wire, hinges and passages
  start: 171
  end: 175
  description: Use paperclip, buckle, compass, watering-can and single-pulley diagrams to check continuous paths,
    holes, shared hinges and passages.
- id: distance-tiling-cycle-rules
  title: Distance, tilings and cycles
  start: 176
  end: 180
  description: Construct a trapezoid, two triangle circles, nearest-site regions, domino tilings and modulo-eight
    cycles, independently checking areas, distances, coverage and return counts.
- id: closure-support-joining-studies
  title: Closure, support and joining studies
  start: 181
  end: 185
  description: Use safety pins, binder clips, stepladders, blind joints and three-blade icons to inspect clasps,
    mounts, spreaders, cavities and rotated copies.
- id: circles-curves-outcomes-codes
  title: Circular regions, curves and coding
  start: 186
  end: 190
  description: Construct annuli, regular hexagons, Bézier midpoint diagrams, two-dice sum maps and prefix trees,
    checking areas, interpolation, cell counts and leaf paths.
