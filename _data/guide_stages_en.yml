  start: 16
  end: 20
  description: Use the same file to isolate subtitle, audio-track and playback-engine issues one at a time.
- id: files-editions
  title: Files and editions
  start: 21
  end: 25
  description: Build a reference clip and verify naming collisions, framing, cloud placeholders and edit relationships.
- id: caption-display-practice
  title: Caption and display practice
  start: 26
  end: 30
  description: Create minimal VTT and check ASS, bilingual text, audio identities and recorded captions.
- id: viewing-controls
  title: Viewing and controls
  start: 31
  end: 35
  description: Compare speed, gestures, HLS dependencies and HDR conditions, then organise personal recordings.
- id: library-access-maintenance
  title: Libraries and access
  start: 36
  end: 40
  description: Plan scan scope, verify accounts, links and server outputs, and rehearse cleanup with a sample.
- id: viewing-checks-navigation
  title: Viewing checks and navigation
  start: 41
  end: 45
  description: Check timing drift, channels and picture edges, then map lectures and ending positions.
- id: file-preparation-support
