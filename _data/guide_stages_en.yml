- id: edition-studies-sharing
  title: Edition studies and sharing
  start: 96
  end: 100
  description: Compare bilingual lines, screentones and page edges; verify credits and write recommendations within
    reading boundaries.
- id: panels-visual-judgements
  title: Panels and visual judgements
  start: 101
  end: 105
  description: Check inset panels, scene duration, character identity, motion symbols and the conditions for comparing
    scale.
- id: evidence-review-boundaries
  title: Evidence and review boundaries
  start: 106
  end: 110
  description: Inspect documentary reconstruction, instructions and board scenes, then separate cover information
    and prepare an original-draft review.
- id: image-expression-cues
  title: Image and expression cues
  start: 111
  end: 115
  description: Check emotional backgrounds, border breaks, dense-panel order, dialogue lettering and cutaway explanatory
    layers.
- id: legends-routes-records
  title: Legends, routes and written records
  start: 116
  end: 120
  description: Audit pictograms and colour cues, then build branching routes, descriptions and balloon-correction
    records.
- id: storage-local-reading
  title: Storage and local reading in the current release
  start: 121
  end: 125
  description: Read storage categories and image-cache scope; check PDF colours, reopening states and direct local
    reading from Home.
- id: visual-evidence-conditions
  title: Visual evidence and condition checks
  start: 126
  end: 130
  description: Use mirrors, shadows, forms, calendars and visual riddles to practise attribution, conditions and
    uncertainty.
- id: file-identity-reading-scope
  title: File identity and reading scope
  start: 131
  end: 135
  description: Check archive integrity, suspected duplicate pages, PDF annotations, container identity and attachments
    with separate evidence layers.
- id: in-story-data-claims
  title: In-story data and claims
  start: 136
  end: 140
  description: Read bar and pie charts, experiment scenes, surveys and price signs while separating values, units,
    conditions and character claims.
- id: archive-metadata-access-evidence
  title: Archive, metadata and access evidence
  start: 141
  end: 145
  description: Distinguish duplicate ZIP paths, ComicInfo metadata, URI components and OPDS link roles, then prepare
    a minimal reproduction.
- id: visual-layers-identifier-rules
  title: Visual layers and identifier rules
  start: 146
  end: 150
  description: Check imagined branches, collage regions, insect occlusion, parts versus steps and scoreboard scope
    while preserving uncertainty.
- id: archive-display-response-audit
  title: Archives, display and access responses
  start: 151
  end: 155
  description: Check compression methods, name collisions, PDF fonts, per-resource WebDAV status and relative OPDS
    links.
- id: diagram-relationship-time-reading
  title: Diagram relationships and time records
  start: 156
  end: 160
  description: Read heatmap cells, tree relationships, midnight-crossing times, flowchart branches and multiple
    object views.
- id: reading-order-path-protocol-identifiers
  title: Reading order, paths and protocol identifiers
  start: 161
  end: 165
  description: Compare EPUB order, Wi-Fi folder previews, PDF labels, download names and PSE templates to check
    identity and scope.
- id: pictured-symbols-combined-relations
  title: Pictured symbols and combined relationships
  start: 166
  end: 170
  description: Read clock faces, balances, overlapping sets, logic gates and crossword grids while retaining assumptions
    and limits.
- id: container-fields-catalogue-boundaries
  title: Container fields and catalogue boundaries
  start: 171
  end: 175
  description: Check PDF boxes, ZIP64 fields, PNG density, EPUB identifiers and OPDS pagination, separating metadata
    from actual reading.
- id: structural-relations-quantity-reading
  title: Structural relationships and quantities
  start: 176
  end: 180
  description: Read cube nets, relative strata ages, coordinate paths, gear trains and RGB wheels through explicit
    assumptions and relationships.
- id: file-representations-entry-addresses
  title: File representations and entry addresses
  start: 181
  end: 185
  description: Check PDF rotation, JPEG scans, PNG colour types, EPUB root paths and HTTP coding layers while retaining
    actual import results.
- id: natural-diagrams-connection-relations
  title: Natural diagrams and connection relationships
  start: 186
  end: 190
  description: Read Moon phases, meanders, coordinate grids, food webs and paper circuits through viewpoints, directions,
    models and connectivity.
- id: pixel-semantics-format-declarations
  title: Pixel semantics and format declarations
  start: 191
  end: 195
  description: Check PNG interlacing and transparency, JPEG orientation, EPUB language and OPDS indirect acquisition,
    separating reports from reader observations.
- id: natural-processes-directional-evidence
  title: Natural processes and directional evidence
  start: 196
  end: 200
  description: Trace leaf veins, sound, water cycles, seismic waves and wind through structure, media, units, timing
    and direction conventions.
- id: field-scales-request-boundaries
  title: Field scales and request boundaries
  start: 201
  end: 205
  description: Check PDF units, PNG text, ZIP descriptors, EPUB landmarks and HTTP ranges, separating reports from
    actual reading.
- id: natural-pathways-period-conditions
  title: Natural pathways and period conditions
  start: 206
  end: 210
  description: Trace rainbow rays, rock processes, tides, pendulums and catchments through viewpoints, states, scales,
    periods and outlets.
- id: image-document-fields-211-215
  title: Image, layout and catalog fields
  description: Separate color sampling, logical dimensions, destination names and offset timestamps before checking
    pages.
  start: 211
  end: 215
- id: natural-mechanisms-216-220
  title: Natural mechanisms and ideal models
  description: Fix geometry, states and boundaries before checking seasons, eclipses, buoyancy, lenses and heat
    transfer.
  start: 216
  end: 220
- start: 221
  end: 225
  title: Structure and meaning in file reports
  summary: Interpret PNG property bits, PDF outlines and EPUB/OPDS fields, separating declarations,identity and
    display through auditable reports.
  id: manyue-lessons-221-225
  description: Interpret PNG property bits, PDF outlines and EPUB/OPDS fields, separating declarations,identity
    and display through auditable reports.
- start: 226
  end: 230
  title: Conditions and quantities in science panels
  summary: Check conditions,values,conservation and model limits in hydrostatic,optical,incline,diffusion and photosynthesis
    panels.
  id: manyue-lessons-226-230
  description: Check conditions,values,conservation and model limits in hydrostatic,optical,incline,diffusion and
    photosynthesis panels.
- start: 231
  end: 235
  title: Quantitative reading of force, energy and flow
  summary: Check work direction, momentum and energy, circular vectors, spring storage and steady-flow continuity
    while retaining held quantities and model conditions.
  id: manyue-lessons-231-235
  description: Check work direction, momentum and energy, circular vectors, spring storage and steady-flow continuity
    while retaining held quantities and model conditions.
- start: 236
  end: 240
  title: Conditional reading of phase changes, Earth processes and orbits
  summary: Track phase and water ledgers, relative plate motion, low-Reynolds settling and focal swept areas to
    identify the assumptions behind each value.
  id: manyue-lessons-236-240
  description: Track phase and water ledgers, relative plate motion, low-Reynolds settling and focal swept areas
    to identify the assumptions behind each value.
- id: manyue-lessons-241-245
  start: 241
  end: 245
  title: Quantitative cards for charge, energy and fields
  description: Check net charge, power constraints, capacitor storage, Coulomb forces and magnetic forces while
    retaining targets, directions and missing conditions.
- id: manyue-lessons-246-250
  start: 246
  end: 250
  title: Reading particles, amounts and state conditions
  description: Read isotope/ion counts, decay, gas states, pH and limiting reactions with explicit units, statistical
    meaning and model boundaries.
- id: manyue-lessons-251-255
  start: 251
  end: 255
  title: Entitlements, appearance and connection checks
  description: Check local and membership capabilities, compare comic color, and diagnose server identity, credentials
    and the Wi-Fi import page.
- id: manyue-lessons-256-260
  start: 256
  end: 260
  title: Import from multiple sources and map progress
  description: Import a single comic from cloud storage, external drives, AirDrop and system file servers, and map
    chapter units for external tracking.
- id: manyue-lessons-261-265
  start: 261
  end: 265
  title: Cloud backups, archives and device reading
  description: Identify iCloud backups and export status, then check archive entries, tablet windows and saving
    an original page.
- id: manyue-lessons-266-270
  start: 266
  end: 270
  title: Import integrity, entitlements and interface checks
  description: Check comic archive integrity and Wi-Fi file sizes, existing purchase restoration, system accessibility
    and interface language.
- id: manyue-lessons-271-275
  start: 271
  end: 275
  title: Recovery, display and server state
  description: Check cloud recovery, same-title comics, system display and Komga and Kavita server state.
- id: manyue-lessons-276-280
  start: 276
  end: 280
  title: Server permissions and source boundaries
  description: Check Kavita lists and specials, Komga roles, Suwayomi sources and OPDS archive import.
