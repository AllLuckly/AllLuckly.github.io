<p>第一次使用可以先读入门与基础操作，再选择一篇创作练习。已经有作品时，可以直接查看导出和问题排查。</p>
<p>练习中的尺寸、颜色与参数用于帮助比较效果，不是唯一正确设置。建议保存独立练习稿，完成后按文中的检查项检查自己的结果。</p>
