<article class="app-card theme-{{ app.id }}">
<div class="app-card-top"><img src="{{ app.icon | relative_url }}" width="64" height="64" alt="{{ app.name | escape }} 图标" loading="lazy"><span class="app-category">{{ app.category }}</span></div>
<h3><a href="{{ app.url | relative_url }}">{{ app.name }} <span aria-hidden="true">↗</span></a></h3><p>{{ app.tagline }}</p>{% assign app_lessons = site.posts | where: 'layout', 'guide' | where: 'app_id', app.id %}<a class="text-link" href="{{ app.url | relative_url }}">应用介绍与 {{ app_lessons.size }} 篇教程 <span aria-hidden="true">→</span></a>
</article>
