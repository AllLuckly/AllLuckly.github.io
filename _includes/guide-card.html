{% assign product = site.data.apps | where: 'id', post.app_id | first %}
<article class="guide-card" data-filter-item="{{ post.app_id }}"><a class="guide-art theme-{{ post.app_id }}" href="{{ post.url | relative_url }}" tabindex="-1" aria-hidden="true"><span class="art-grid"></span><img src="{{ product.icon | relative_url }}" alt="" width="90" height="90" loading="lazy"><span class="art-label">{{ product.name }}<br><small>{{ post.level | default: '使用指南' }} / GUIDE</small></span><span class="art-arrow">↗</span></a><div class="guide-meta"><span>{{ product.category }}</span><span>{{ post.level | default: '指南' }}</span></div><h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3><p>{{ post.description }}</p><div class="guide-byline">Bison <span>·</span> <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time></div></article>
