<li data-filter-item="{{ post.app_id }}" data-search-text="{{ post.title | append: ' ' | append: post.description | append: ' ' | append: post.topic | escape }}"><span class="lesson-number" aria-hidden="true">{% if post.series_order < 10 %}0{% endif %}{{ post.series_order }}</span><div><p class="lesson-meta">{{ post.topic | default: post.level }} · 约 {{ post.reading_time | default: 6 }} 分钟阅读</p><h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3><p>{{ post.description }}</p></div><span class="lesson-arrow" aria-hidden="true">↗</span></li>
